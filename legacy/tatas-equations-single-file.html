<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d6a46">
<title>Tata's Equations</title>
<style>
:root{
  --cube:clamp(40px,6.4vw,58px); --mini:clamp(32px,5vw,44px);
  --ink:#1d2340; --paper:#fffdf6; --accent:#ffb703; --accent2:#fb8500;
  --good:#2bb673; --bad:#ef476f; --purple:#7b2cbf; --sky:#4dabf7;
  --font:"Trebuchet MS","Segoe UI Rounded","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:#1d6a46;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body.mat-felt{background:radial-gradient(circle at 30% 15%,#3fb27f,#1d6a46 70%)}
body.mat-space{background:radial-gradient(1px 1px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 60%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 40% 80%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 85% 20%,#ffe 50%,transparent 51%),radial-gradient(1px 1px at 10% 70%,#fff 50%,transparent 51%),radial-gradient(ellipse at top,#3a2f8b,#0b0d24 70%);background-size:220px 220px,300px 300px,260px 260px,380px 380px,180px 180px,100% 100%}
body.mat-jungle{background:radial-gradient(circle at 10% 10%,rgba(160,230,90,.35) 0 60px,transparent 61px),radial-gradient(circle at 90% 30%,rgba(30,90,30,.5) 0 90px,transparent 91px),radial-gradient(circle at 20% 90%,rgba(60,140,40,.45) 0 120px,transparent 121px),linear-gradient(160deg,#3a8f3c,#174d1c)}
body.mat-ocean{background:radial-gradient(circle at 15% 85%,rgba(255,255,255,.25) 0 6px,transparent 7px),radial-gradient(circle at 18% 75%,rgba(255,255,255,.2) 0 4px,transparent 5px),radial-gradient(circle at 80% 60%,rgba(255,255,255,.2) 0 8px,transparent 9px),radial-gradient(circle at 84% 48%,rgba(255,255,255,.18) 0 5px,transparent 6px),linear-gradient(180deg,#36c2f0,#0b4f8a 75%,#083a66)}
button{font-family:inherit}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.screen.on{display:flex}
h1,h2,h3{margin:.2em 0}
.white{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}

/* ---------- Buttons ---------- */
.btn{border:none;border-radius:18px;padding:14px 22px;font-size:20px;font-weight:800;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{font-size:26px;padding:18px 28px;min-width:260px;border-radius:24px}
.btn.small{font-size:15px;padding:8px 14px;min-height:40px;border-radius:14px}
.btn.yellow{background:linear-gradient(#ffd166,#ffb703)}
.btn.orange{background:linear-gradient(#ffa94d,#fb8500);color:#fff}
.btn.green{background:linear-gradient(#63e6a0,#2bb673);color:#fff}
.btn.blue{background:linear-gradient(#74c0fc,#1c7ed6);color:#fff}
.btn.purple{background:linear-gradient(#b185f7,#7b2cbf);color:#fff}
.btn.pink{background:linear-gradient(#ff8fab,#ef476f);color:#fff}
.btn.ghost{background:rgba(255,255,255,.2);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:14px;align-items:center}

/* ---------- Cubes ---------- */
.cube{width:var(--cube);height:var(--cube);border-radius:22%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--cube)*.56);color:#fff;position:relative;flex:0 0 auto;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),inset 0 4px 0 rgba(255,255,255,.35),0 4px 7px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.3);cursor:pointer;line-height:1}
.cube.mini{width:var(--mini);height:var(--mini);font-size:calc(var(--mini)*.56)}
.cube.tiny{width:30px;height:30px;font-size:17px;border-radius:7px;cursor:default}
.c-red{background:linear-gradient(145deg,#ff6b6b,#c92a2a)}
.c-blue{background:linear-gradient(145deg,#4dabf7,#1864ab)}
.c-green{background:linear-gradient(145deg,#51cf66,#2b8a3e)}
.c-black{background:linear-gradient(145deg,#5c5f66,#121316)}
.c-none{background:linear-gradient(145deg,#adb5bd,#5c636a)}
.skin-candy .c-red{background:repeating-linear-gradient(45deg,#ff8fab 0 7px,#ffc2d1 7px 14px)}
.skin-candy .c-blue{background:repeating-linear-gradient(45deg,#74c0fc 0 7px,#c5e6ff 7px 14px)}
.skin-candy .c-green{background:repeating-linear-gradient(45deg,#8ce99a 0 7px,#d3f9d8 7px 14px)}
.skin-candy .c-black{background:repeating-linear-gradient(45deg,#9775fa 0 7px,#d0bfff 7px 14px)}
.skin-candy .cube{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.skin-lava .cube{background:radial-gradient(circle at 30% 30%,#ffd43b,#f76707 40%,#5c1a00 85%)}
.skin-lava .c-red{box-shadow:0 0 0 3px #ff6b6b inset,0 4px 10px rgba(255,80,0,.6)}
.skin-lava .c-blue{box-shadow:0 0 0 3px #4dabf7 inset,0 4px 10px rgba(255,80,0,.6)}
.skin-lava .c-green{box-shadow:0 0 0 3px #51cf66 inset,0 4px 10px rgba(255,80,0,.6)}
.skin-lava .c-black{box-shadow:0 0 0 3px #222 inset,0 4px 10px rgba(255,80,0,.6)}
.skin-galaxy .cube{background:radial-gradient(1px 1px at 25% 30%,#fff 60%,transparent 61%),radial-gradient(1px 1px at 70% 65%,#fff 60%,transparent 61%),radial-gradient(1.5px 1.5px at 55% 20%,#fff 60%,transparent 61%),radial-gradient(circle at 30% 30%,#7048e8,#1a0b3d 80%)}
.skin-galaxy .c-red{border:3px solid #ff6b6b}.skin-galaxy .c-blue{border:3px solid #4dabf7}.skin-galaxy .c-green{border:3px solid #51cf66}.skin-galaxy .c-black{border:3px solid #868e96}
.skin-gold .cube{background:linear-gradient(145deg,#fff3bf,#fcc419 40%,#e67700);color:#5c3c00;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.skin-gold .c-red{border:3px solid #e03131}.skin-gold .c-blue{border:3px solid #1971c2}.skin-gold .c-green{border:3px solid #2f9e44}.skin-gold .c-black{border:3px solid #212529}
#game .z-res .cube{touch-action:none}
.cube.sel{outline:5px solid #ffe066;outline-offset:2px;transform:translateY(-5px) scale(1.08);z-index:2}
.z-res .cube:hover,.pool .cube:not(.used):hover{animation:wiggle .45s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg) scale(1.05)}75%{transform:rotate(9deg) scale(1.05)}}
.cube.locked{filter:saturate(.35) brightness(.9)}
.cube.locked::after{content:"🔒";position:absolute;top:-9px;right:-9px;font-size:16px;text-shadow:none;filter:none}
.cube.tumble{animation:tumble .95s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes tumble{0%{transform:translate(var(--tx),-110vh) rotate(var(--rot)) scale(.7);opacity:0}55%{opacity:1}78%{transform:translate(0,6px) rotate(-8deg) scale(1.05)}100%{transform:none}}
.cube.thunk{animation:thunk .4s ease-out}
@keyframes thunk{0%{transform:scale(1.35) translateY(-14px)}60%{transform:scale(.92)}100%{transform:none}}
.cube.used{opacity:.25;pointer-events:none}
.cube.hl{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 4px #ffe066,0 0 14px #ffe066}to{box-shadow:0 0 0 7px #ffe066,0 0 26px #fff}}
.paren{display:inline-flex;align-items:center;justify-content:center;width:22px;height:var(--mini);font-size:calc(var(--mini)*.8);font-weight:900;color:#fff;cursor:pointer}
.paren.dark{color:var(--ink)}

/* ---------- Mat ---------- */
#game{padding-top:8px;gap:8px}
.jersey{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;padding:0 4px;background:linear-gradient(#ff6b6b,#c92a2a);color:#fff;font-weight:900;font-size:16px;border-radius:9px 9px 6px 6px;box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.jersey.j2{background:linear-gradient(#74c0fc,#1c7ed6)}
.jersey.j3{background:linear-gradient(#69db7c,#2b8a3e)}
.also{width:100%;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-weight:700;font-size:15px;border-top:2px dashed #dee2e6;padding-top:6px}
.also .btn{min-height:38px}
.setrow select{font-size:16px;padding:7px;border-radius:10px;border:2px solid #ced4da;font-family:inherit}
#gTop,#gAct,#gGoal{width:100%;max-width:1100px}
#gMat{width:100%;max-width:1300px;position:relative}
#game.three{overflow:hidden}
#game.three #gMat{flex:1 1 auto;min-height:230px}
#gMat canvas{display:block;width:100%;height:100%;touch-action:none}
.goalhud{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.92);border-radius:16px;padding:4px 14px;font-weight:900;font-size:20px;width:fit-content;margin:0 auto;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.goalhud .expr{padding:3px 6px;min-height:0;--mini:30px}
#game.three .actionbar{padding:8px 10px;gap:6px}
#game.three .speech .who{width:44px;height:44px}
.game-top{width:100%;max-width:1100px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.scores{display:flex;gap:8px;flex:1;justify-content:center;flex-wrap:wrap}
.pl{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.88);border-radius:16px;padding:5px 12px;font-size:17px;border:3px solid transparent}
.pl.turn{border-color:#ffd60a;box-shadow:0 0 14px #ffd60a}
.pl .pts{background:var(--ink);color:#fff;border-radius:10px;padding:2px 9px;font-weight:900}
.shake-no{color:#fff;font-weight:800;white-space:nowrap}
.mat{width:100%;max-width:1100px;display:flex;flex-direction:column;gap:8px}
.zrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.zone{background:rgba(255,255,255,.13);border:3px dashed rgba(255,255,255,.5);border-radius:18px;padding:6px 8px 8px;min-height:calc(var(--cube) + 42px);transition:background .2s,border-color .2s}
.zone h3{color:#fff;font-size:15px;letter-spacing:1px;margin:0 0 5px;text-shadow:0 1px 0 rgba(0,0,0,.3);display:flex;align-items:center;gap:6px}
.zone h3 small{font-weight:600;opacity:.85;letter-spacing:0}
.zone .cubes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:var(--cube)}
.zone.target{border-color:#ffe066;background:rgba(255,224,102,.25);cursor:pointer;animation:pulse 1s infinite alternate}
@keyframes pulse{to{background:rgba(255,224,102,.4)}}
.z-goal{background:rgba(255,255,255,.22);border-style:solid}
.z-required{border-color:#8ce99a}.z-permitted{border-color:#a5d8ff}.z-forbidden{border-color:#ffa8a8}
.gval{background:#fff;color:var(--ink);border-radius:10px;padding:1px 10px;font-size:20px}
.empty{color:rgba(255,255,255,.55);font-style:italic;font-size:14px}
.actionbar{width:100%;max-width:1100px;background:rgba(255,253,246,.96);border-radius:20px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.speech{display:flex;align-items:center;gap:10px}
.speech .who{flex:0 0 auto;width:54px;height:54px}
.speech .txt{font-size:18px;line-height:1.3;font-weight:600}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn.now{background:linear-gradient(#ffe066,#fab005);font-size:22px}
.btn.imp{background:linear-gradient(#b185f7,#7b2cbf);color:#fff;font-size:22px}

/* ---------- Avatars / mascot ---------- */
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;width:54px;height:54px;font-size:32px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 3px 6px rgba(0,0,0,.25);flex:0 0 auto}
.avatar.sm{width:32px;height:32px;font-size:20px}
.avatar.lg{width:96px;height:96px;font-size:58px}
.pip{display:inline-block}
.pip svg{width:100%;height:100%;overflow:visible}
.pip.bob svg{animation:none}
.pip.hop svg{animation:none}
.pip.cheer svg{animation:cheer .7s ease-in-out 1}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes hop{40%{transform:translateY(-7px)}}
@keyframes cheer{50%{transform:translateY(-12px) rotate(-4deg)}}
.bubble{background:#fff;border-radius:20px;padding:12px 16px;font-size:20px;font-weight:700;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:440px}
.bubble::before{content:"";position:absolute;left:-14px;top:24px;border:8px solid transparent;border-right:14px solid #fff;border-left:0}

/* ---------- Title ---------- */
.logo{font-size:clamp(40px,9vw,84px);font-weight:900;color:#fff;text-align:center;line-height:1;text-shadow:0 5px 0 #0f3d28,0 10px 22px rgba(0,0,0,.35);letter-spacing:1px}
.logo .eq{display:block;color:#ffd166}
.xpbar{background:rgba(0,0,0,.25);border-radius:12px;height:20px;width:min(420px,86vw);overflow:hidden;position:relative}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,#ff9f1c);border-radius:12px;transition:width .6s}
.xpbar span{position:absolute;inset:0;text-align:center;font-size:13px;font-weight:800;line-height:20px;color:#fff;text-shadow:0 1px 1px #000}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;width:min(640px,94vw)}
.menu .btn{width:100%}
#splash{justify-content:center;gap:28px}
.tapgo{animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}

/* ---------- Intro ---------- */
#intro{justify-content:center;gap:16px;overflow:hidden}
.it-row{display:flex;gap:clamp(4px,1vw,10px);justify-content:center;margin:8px 0}
.it-cube{--s:clamp(34px,8.2vw,74px);width:var(--s);height:var(--s);font-size:calc(var(--s)*.62);animation:tumble 1s cubic-bezier(.2,.9,.3,1.3) both;cursor:default}
.it-cube.space{visibility:hidden}
.intro-glow .it-cube{animation:tumble 1s cubic-bezier(.2,.9,.3,1.3) both,shine 1.2s ease-in-out 1}
@keyframes shine{50%{filter:brightness(1.6) drop-shadow(0 0 12px #fff)}}
.skiphint{position:absolute;bottom:18px;color:rgba(255,255,255,.75);font-size:15px}
.pop-in{animation:popin .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
#dedication{justify-content:center}
.dedi{background:var(--paper);border-radius:26px;padding:34px 30px;max-width:560px;text-align:center;font-size:clamp(22px,4.4vw,30px);font-weight:700;line-height:1.4;box-shadow:0 12px 40px rgba(0,0,0,.35);border:6px solid #ffd166}
.dedi .heart{font-size:46px;display:block;margin-bottom:8px}

/* ---------- Cards / panels ---------- */
.panel{background:var(--paper);border-radius:24px;padding:18px;width:min(980px,96vw);box-shadow:0 8px 26px rgba(0,0,0,.25)}
.hdr{width:min(980px,96vw);display:flex;align-items:center;gap:12px;margin-bottom:10px}
.hdr h2{flex:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);font-size:30px}
.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.opp{background:#fff;border-radius:20px;padding:14px;text-align:center;cursor:pointer;border:4px solid transparent;box-shadow:0 5px 0 rgba(0,0,0,.15);position:relative}
.opp:hover{border-color:#ffd166}
.opp.lock{filter:grayscale(1);opacity:.6;cursor:not-allowed}
.opp .stars{color:#fab005;font-size:18px}
.opp .done{position:absolute;top:8px;right:10px;font-size:22px}
.seg{display:inline-flex;background:#e9ecef;border-radius:14px;padding:4px;gap:4px}
.seg button{border:none;background:transparent;border-radius:10px;padding:8px 14px;font-weight:800;font-size:16px;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}

/* ---------- Modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal-back.on{display:flex}
#modal{z-index:60}
.modal{background:var(--paper);border-radius:26px;padding:20px;width:min(560px,96vw);max-height:94vh;overflow-y:auto;box-shadow:0 14px 50px rgba(0,0,0,.4);animation:popin .35s cubic-bezier(.2,1.3,.4,1)}
.modal.wide{width:min(900px,98vw)}
.modal h2{text-align:center;font-size:28px}
.modal p{font-size:18px;line-height:1.4}
.reasons{background:#fff4e6;border-radius:16px;padding:10px 14px 10px 34px;font-size:17px;line-height:1.4}
.reasons li{margin:4px 0}
.okbox{background:#e6fcf5;border-radius:16px;padding:10px 14px;font-size:18px}
.expr{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;min-height:calc(var(--mini) + 10px);padding:6px;background:#1d6a46;border-radius:14px}
.score-line{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800;padding:6px 10px;border-radius:12px;background:#fff;margin:6px 0}
.score-line .p{font-size:24px}
.xplist{font-size:16px;color:#5f3dc4;font-weight:700}
.banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(48px,12vw,120px);font-weight:900;color:#fff;z-index:70;pointer-events:none;text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 30px rgba(255,255,255,.6);animation:slam 1.3s ease-out both;white-space:nowrap}
.banner small{display:block;font-size:.3em;text-align:center}
@keyframes slam{0%{transform:translate(-50%,-50%) scale(3);opacity:0}20%{transform:translate(-50%,-50%) scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}

/* ---------- Builder ---------- */
.b-goal{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:22px;font-weight:800}
.b-live{text-align:center;font-size:22px;font-weight:800;min-height:34px}
.b-live.good{color:var(--good)}.b-live.meh{color:#868e96;font-size:17px}
.b-tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.b-tools .btn{min-width:62px;font-size:24px}
.pool{background:#f1f3f5;border-radius:16px;padding:8px 10px;margin-top:8px}
.pool h4{margin:0 0 6px;font-size:16px}
.pool .cubes{display:flex;flex-wrap:wrap;gap:6px}
.pool.forb{opacity:.6}
.pool.forb .cube{cursor:not-allowed}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:15px;font-weight:700}
.checks .y{color:var(--good)}.checks .n{color:#adb5bd}

/* ---------- Badges ---------- */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.bdg{background:#fff;border-radius:18px;padding:10px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.bdg b{display:block;font-size:15px;margin-top:6px}
.bdg small{display:block;color:#868e96;font-size:12.5px;margin-top:3px;line-height:1.25}
.medal{width:78px;height:78px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:40px;position:relative;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 4px 8px rgba(0,0,0,.2)}
.medal::before{content:"";position:absolute;inset:6px;border-radius:50%;border:3px dashed rgba(255,255,255,.65)}
.tier-bronze{background:radial-gradient(circle at 35% 30%,#ffd8a8,#d9822b)}
.tier-silver{background:radial-gradient(circle at 35% 30%,#fff,#adb5bd)}
.tier-gold{background:radial-gradient(circle at 35% 30%,#fff3bf,#f59f00)}
.tier-special{background:radial-gradient(circle at 35% 30%,#e5dbff,#7048e8)}
.medal.locked{background:#dee2e6}
.medal.locked span{filter:brightness(0);opacity:.28}
.medal.locked::before{border-color:#ced4da}
.tierh{margin:14px 0 8px;font-size:20px}
.cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.cos .it{background:#fff;border-radius:16px;padding:10px;text-align:center;cursor:pointer;border:4px solid transparent;font-weight:700}
.cos .it.on{border-color:#2bb673}
.cos .it.lock{opacity:.5;cursor:not-allowed}
.swatch{height:44px;border-radius:12px;margin-bottom:6px}

/* ---------- Toasts ---------- */
#toasts{position:fixed;top:12px;right:12px;z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#fff;border-radius:18px;padding:8px 14px 8px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:toastIn .5s cubic-bezier(.2,1.3,.4,1) both;font-weight:800;max-width:320px}
.toast .medal{width:48px;height:48px;font-size:24px}
.toast .medal::before{inset:4px;border-width:2px}
.toast small{display:block;color:#7048e8;font-size:12px}
@keyframes toastIn{from{transform:translateX(120%)}to{transform:none}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
#ghost{position:fixed;pointer-events:none;z-index:95;display:none;transform:translate(-50%,-50%) scale(1.15)}

/* ---------- Stats ---------- */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{background:#fff;border-radius:16px;padding:12px;text-align:center}
.stat .v{font-size:30px;font-weight:900;color:#1c7ed6}
.stat .l{font-size:14px;color:#495057;font-weight:700}
.chart{background:#fff;border-radius:16px;padding:10px;margin-top:10px}
.better{font-size:22px;font-weight:900;text-align:center;color:#2b8a3e;margin:6px 0}

/* ---------- Settings ---------- */
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #e9ecef;flex-wrap:wrap}
.setrow label{flex:1;min-width:160px;font-size:18px;font-weight:700}
.setrow input[type=range]{flex:2;min-width:180px;height:30px}
.setrow input[type=text],textarea{font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid #ced4da;font-family:inherit}
textarea{width:100%;min-height:70px;-webkit-user-select:text;user-select:text}
.facetable td{padding:3px 6px}
.tut-slide{text-align:center;min-height:190px}
.tut-slide p{font-size:22px;font-weight:700}
.progress{height:8px;background:#e9ecef;border-radius:6px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:#7048e8;width:0}
@media (max-width:560px){
  .btn.big{min-width:0;width:100%}
  .zone h3{font-size:12px;letter-spacing:0}
  .zrow{grid-template-columns:repeat(3,1fr);gap:5px}
  .zrow .zone{padding:5px;min-height:calc(var(--cube) + 34px)}
  .zrow .zone h3 small{display:none}
  .zrow .cube{--cube:34px}
  :root{--cube:40px}
  .game-top .shake-no{font-size:13px}
  .speech .txt{font-size:16px}
  .btn.now,.btn.imp{font-size:19px}
  .pl{font-size:14px;padding:4px 8px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
/*ENGINE-START*/
// ===================== TATA'S EQUATIONS — MATH ENGINE =====================
// Exact fractions, expression evaluator, Solution validator and solver.
// No floating point is used for game values: every number is {n, d} (numerator/denominator).
var Eq = (function () {
  'use strict';

  // ---- Cube faces (see RULES_SUMMARY.md §1; change here if your set differs) ----
  var CUBE_FACES = {
    red:   ['0', '1', '2', '3', '+', '-'],
    blue:  ['0', '1', '2', '3', '*', '/'],
    green: ['4', '5', '6', '-', '*', '^'],
    black: ['7', '8', '9', '+', '/', 'r']
  };
  var COLORS = ['red', 'blue', 'green', 'black'];
  var OPS = ['+', '-', '*', '/', '^', 'r'];            // r = root (√)
  var SHOW = { '+': '+', '-': '−', '*': '×', '/': '÷', '^': '^', 'r': '√', '(': '(', ')': ')' };
  var LIMIT = 1000000;                                  // biggest numerator/denominator we check
  var TWO = { n: 2, d: 1 };

  function isDigit(s) { return typeof s === 'string' && s.length === 1 && s >= '0' && s <= '9'; }
  function sym(t) { return typeof t === 'string' ? t : t.s; }
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a; }

  // Make a reduced fraction, or return an error code string.
  function frac(n, d) {
    if (d === undefined) d = 1;
    if (d === 0) return 'divzero';
    if (d < 0) { n = -n; d = -d; }
    var g = gcd(n, d);
    if (g > 1) { n /= g; d /= g; }
    if (n === 0) { n = 0; d = 1; }
    if (Math.abs(n) > LIMIT || d > LIMIT) return 'big';
    return { n: n, d: d };
  }
  function F(n, d) { var r = frac(n, d); if (typeof r === 'string') throw new Error(r); return r; }
  function eqF(a, b) { return a.n === b.n && a.d === b.d; }
  function fmt(v) {
    if (!v) return '?';
    if (v.d === 1) return String(v.n).replace('-', '−');
    var neg = v.n < 0, n = Math.abs(v.n), w = Math.floor(n / v.d), r = n % v.d;
    var s = w ? (w + ' ' + r + '/' + v.d) : (r + '/' + v.d);
    return (neg ? '−' : '') + s;
  }

  // One operation on two fractions. Returns a fraction or an error code string.
  // fr = fractions unlocked? (if not, every division must come out whole)
  // Powers and roots follow the Elementary "General Rule": whole numbers only.
  function opCore(op, a, b, fr) {
    switch (op) {
      case '+': return frac(a.n * b.d + b.n * a.d, a.d * b.d);
      case '-': return frac(a.n * b.d - b.n * a.d, a.d * b.d);
      case '*': return frac(a.n * b.n, a.d * b.d);
      case '/':
        if (b.n === 0) return 'divzero';
        var q = frac(a.n * b.d, a.d * b.n);
        if (typeof q !== 'string' && !fr && q.d !== 1) return 'fraction';
        return q;
      case '^':
        if (a.d !== 1 || b.d !== 1 || a.n < 0 || b.n < 0) return 'powwhole';
        if (a.n === 0 && b.n === 0) return 'zerozero';
        var x = 1;
        for (var i = 0; i < b.n; i++) { x *= a.n; if (x > LIMIT) return 'big'; if (a.n <= 1) break; }
        return { n: x, d: 1 };
      case 'r': // a = index, b = radicand
        if (a.d !== 1 || a.n < 1) return 'rootindex';
        if (b.d !== 1 || b.n < 0) return 'rootwhole';
        if (a.n === 1) return { n: b.n, d: 1 };
        var g = Math.round(Math.pow(b.n, 1 / a.n));
        for (var c = Math.max(0, g - 1); c <= g + 1; c++) if (Math.pow(c, a.n) === b.n) return { n: c, d: 1 };
        return 'rootnotwhole';
    }
    return 'syntax';
  }

  var MSG = {
    divzero: "You can't divide by zero. Nobody can, not even the wizard!",
    big: "That number got too gigantic for our cubes to check.",
    fraction: "That division doesn't come out even. Fractions unlock later, so try a different division!",
    powwhole: "For powers (^), both numbers must be whole numbers like 0, 1, 2, 3.",
    zerozero: "0 ^ 0 isn't a number. Even grown-up mathematicians argue about it!",
    rootindex: "The number in front of √ must be 1, 2, 3, … (no number in front means 2).",
    rootwhole: "The number under √ must be a whole number (0, 1, 2, …).",
    rootnotwhole: "That root isn't a whole number. Square roots that work: √0, √1, √4, √9, √16, √25, …",
    concat: "Two digit cubes are touching, so they make a two-digit number. In a Solution every cube is its own one-digit number. Put an operation between them!",
    threedigit: "Three digits in a row make a three-digit number. The Goal can only use one- or two-digit numbers.",
    sign: "+ and − can only add or subtract. They can't be a plus or minus sign in front of a number.",
    opstart: "An operation needs a number on both sides.",
    incomplete: "It isn't finished yet. It ends with an operation or an open parenthesis.",
    missingop: "Two things are side by side with no operation between them.",
    paren: "The parentheses don't match up.",
    emptyparen: "There's an empty pair of parentheses.",
    empty: "Nothing built yet!",
    syntax: "That doesn't make a math expression."
  };
  function err(code) { return { ok: false, code: code, msg: MSG[code] || code }; }

  // ---- Evaluator ----
  // tokens: array of symbols ('0'-'9', '+', '-', '*', '/', '^', 'r', '(', ')') or objects {s:symbol,...}
  // opts.multiDigit: allow two-digit numerals (Goal only). opts.fractions: fractions unlocked.
  // Order: ( ) first, then roots (√ binds to the item right after it; a number right
  // before √ is its index), then ^ (right to left), then × ÷, then + − (left to right).
  function evaluate(tokens, opts) {
    opts = opts || {};
    var fr = !!opts.fractions, maxD = opts.multiDigit ? 2 : 1, madeFraction = false;
    var toks = [], i = 0;
    while (i < tokens.length) {
      var s = sym(tokens[i]);
      if (isDigit(s)) {
        var j = i, str = '';
        while (j < tokens.length && isDigit(sym(tokens[j]))) { str += sym(tokens[j]); j++; }
        if (str.length > maxD) return err(maxD === 1 ? 'concat' : 'threedigit');
        toks.push({ k: 'n', v: { n: parseInt(str, 10), d: 1 } });
        i = j;
      } else if (OPS.indexOf(s) >= 0 || s === '(' || s === ')') { toks.push({ k: s }); i++; }
      else return err('syntax');
    }
    if (!toks.length) return err('empty');
    var p = 0;
    function peek() { return toks[p] ? toks[p].k : null; }
    function fail(c) { throw { code: c }; }
    function chk(r) { if (typeof r === 'string') fail(r); if (r.d !== 1) madeFraction = true; return r; }
    function expr() {
      var l = term();
      while (peek() === '+' || peek() === '-') { var o = toks[p++].k; var r = term(); l = chk(opCore(o, l, r, fr)); }
      return l;
    }
    function term() {
      var l = power();
      while (peek() === '*' || peek() === '/') { var o = toks[p++].k; var r = power(); l = chk(opCore(o, l, r, fr)); }
      return l;
    }
    function power() {
      var b = rootChain();
      if (peek() === '^') { p++; var e = power(); return chk(opCore('^', b, e, fr)); }
      return b;
    }
    function rootChain() {
      var a = atom();
      while (peek() === 'r') { p++; var b = atom(); a = chk(opCore('r', a, b, fr)); }
      return a;
    }
    function atom() {
      var k = peek();
      if (k === 'n') return toks[p++].v;
      if (k === '(') {
        p++;
        if (peek() === ')') fail('emptyparen');
        var v = expr();
        if (peek() === null) fail('paren');
        if (peek() !== ')') fail('missingop');
        p++; return v;
      }
      if (k === 'r') { p++; var x = atom(); return chk(opCore('r', TWO, x, fr)); }
      if (k === '+' || k === '-') fail('sign');
      if (k === '*' || k === '/' || k === '^') fail('opstart');
      if (k === ')') fail(p === 0 ? 'paren' : 'opstart');
      fail('incomplete');
    }
    try {
      var v = expr();
      if (p < toks.length) fail(peek() === ')' ? 'paren' : 'missingop');
      return { ok: true, value: v, madeFraction: madeFraction };
    } catch (e) {
      if (e && e.code) return err(e.code);
      throw e;
    }
  }

  function cubeCount(tokens) { var n = 0; tokens.forEach(function (t) { var s = sym(t); if (s !== '(' && s !== ')') n++; }); return n; }

  // ---- Goal check ----
  function checkGoal(tokens, fractions) {
    var n = cubeCount(tokens);
    if (n < 1) return { ok: false, reasons: [MSG.empty] };
    if (n > 6) return { ok: false, reasons: ['A Goal can have at most six cubes.'] };
    var ev = evaluate(tokens, { multiDigit: true, fractions: fractions });
    if (!ev.ok) return { ok: false, reasons: [ev.msg] };
    return { ok: true, value: ev.value, reasons: [] };
  }

  // ---- Solution check ----
  // tokens: [{s, id}] for cubes and '(' ')' strings for parentheses.
  // ctx: {goal, zone(id)->'required'|'permitted'|'forbidden'|'resources'|'goal',
  //       required:[ids], mode:'now'|'impossible'|'last'|'free'|'daily', fractions, label(id)->string}
  function checkSolution(tokens, ctx) {
    var reasons = [], ids = [];
    tokens.forEach(function (t) { if (typeof t === 'object' && t.id != null) ids.push(t.id); });
    if (!ids.length) return { ok: false, value: null, reasons: [MSG.empty] };
    var label = ctx.label || function (id) { return String(id); };
    if (ids.length < 2) reasons.push('A Solution needs at least two cubes.');
    var forb = [], res = 0, goalUsed = false, seen = {};
    ids.forEach(function (id) {
      if (seen[id]) reasons.push('The same cube was used twice.');
      seen[id] = true;
      var z = ctx.zone(id);
      if (z === 'forbidden') forb.push(id);
      else if (z === 'resources') res++;
      else if (z === 'goal') goalUsed = true;
    });
    if (forb.length) reasons.push('It uses a Forbidden cube (' + forb.map(label).join(', ') + '). Forbidden cubes are off-limits.');
    var missing = (ctx.required || []).filter(function (id) { return ids.indexOf(id) < 0; });
    if (missing.length) reasons.push('It leaves out Required cube' + (missing.length > 1 ? 's ' : ' ') + missing.map(label).join(', ') + '. Every Required cube must be used.');
    if (ctx.mode === 'now' && res > 1) reasons.push('After a Now! challenge you may add only ONE cube from Resources (this uses ' + res + ').');
    if ((ctx.mode === 'last' || ctx.mode === 'daily') && res > 0) reasons.push('Only cubes on the mat (Required and Permitted) may be used.');
    if (goalUsed) reasons.push('Cubes in the Goal stay in the Goal. They can\'t go in the Solution.');
    var ev = evaluate(tokens, { fractions: ctx.fractions });
    var value = null;
    if (!ev.ok) reasons.push(ev.msg);
    else {
      value = ev.value;
      if (!eqF(value, ctx.goal)) reasons.push('Your Solution equals ' + fmt(value) + ', but the Goal is ' + fmt(ctx.goal) + '.');
    }
    return { ok: reasons.length === 0, value: value, reasons: reasons, madeFraction: !!ev.madeFraction, cubes: ids.length, resUsed: res };
  }

  // ---- Solver ----
  function nowMs() { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); }
  function countMap(arr) { var m = {}; arr.forEach(function (s) { m[s] = (m[s] || 0) + 1; }); return m; }
  function uniq(arr) { var o = []; arr.forEach(function (s) { if (o.indexOf(s) < 0) o.push(s); }); return o; }
  var TIMEOUT = { timeout: true };

  // Build the expression text with as few parentheses as possible (internal symbols).
  function wrap(e, need) { return e.p < need ? '(' + e.s + ')' : e.s; }
  function combine(o, L, R, v) {
    switch (o) {
      case '+': case '-': return { v: v, s: L.s + o + (R.p <= 1 ? '(' + R.s + ')' : R.s), p: 1 };
      case '*': case '/': return { v: v, s: wrap(L, 2) + o + (R.p <= 2 ? '(' + R.s + ')' : R.s), p: 2 };
      case '^': return { v: v, s: (L.p <= 3 ? '(' + L.s + ')' : L.s) + '^' + wrap(R, 3), p: 3 };
      case 'r': return { v: v, s: wrap(L, 4) + 'r' + wrap(R, 4), p: 3.5 };
    }
  }

  // Sub-multiset splits of a sorted digit string: [[A,B], ...] with A,B non-empty.
  var splitCache = {};
  function splits(S) {
    if (splitCache[S]) return splitCache[S];
    var vals = uniq(S.split('')), cnt = vals.map(function (v) { return S.split(v).length - 1; });
    var out = [], cur = vals.map(function () { return 0; });
    (function rec(i) {
      if (i === vals.length) {
        var a = '', b = '', na = 0;
        for (var k = 0; k < vals.length; k++) { a += vals[k].repeat(cur[k]); b += vals[k].repeat(cnt[k] - cur[k]); na += cur[k]; }
        if (na > 0 && na < S.length) out.push([a, b]);
        return;
      }
      for (var c = 0; c <= cnt[i]; c++) { cur[i] = c; rec(i + 1); }
    })(0);
    splitCache[S] = out;
    return out;
  }

  // p: {goal, req:[symbols], opt:[symbols], res:[symbols], mode:'now'|'impossible'|'free',
  //     fractions, maxDigits, timeMs}
  // 'now': all req + any opt + at most one res. 'impossible'/'free': all req + any of opt∪res.
  // Returns {found:true, expr, tokens} or {found:false, complete:bool}.
  // complete=false means it ran out of time or hit the size limit, so "not found" isn't proof.
  function solve(p) {
    var deadline = nowMs() + (p.timeMs || 500);
    var base = { goal: p.goal, req: p.req || [], fractions: !!p.fractions, maxDigits: p.maxDigits || 6, deadline: deadline, memo: new Map() };
    var scen = [];
    var opt = p.opt || [], res = p.res || [];
    if (p.mode === 'now') {
      scen.push({ opt: opt, must: null });
      uniq(res).forEach(function (s) { scen.push({ opt: opt.concat([s]), must: s }); });
    } else scen.push({ opt: opt.concat(res), must: null });
    var complete = true;
    for (var i = 0; i < scen.length; i++) {
      var r = core(base, scen[i].opt, scen[i].must);
      if (r.found) return r;
      if (!r.complete) complete = false;
      if (nowMs() > deadline) { complete = false; break; }
    }
    return { found: false, complete: complete };
  }

  function core(base, opt, must) {
    var all = base.req.concat(opt);
    var reqD = base.req.filter(isDigit).sort();
    var reqO = countMap(base.req.filter(function (s) { return !isDigit(s); }));
    var availD = countMap(all.filter(isDigit));
    var availO = countMap(all.filter(function (s) { return !isDigit(s); }));
    var maxD = base.maxDigits;
    var complete = true;
    if (reqD.length > maxD) return { found: false, complete: false };
    var totalD = 0; for (var dk in availD) totalD += availD[dk];
    if (totalD > maxD) complete = false; // bigger Solutions exist that we won't search

    // Only "track" (count) op types that could run out; plentiful ones are treated as unlimited.
    var tracked = [], caps = [], idx = {};
    OPS.forEach(function (t) {
      var a = availO[t] || 0;
      if (!a) return;
      if (t === 'r' || (reqO[t] || 0) > 0 || a < maxD - 1 || must === t) { idx[t] = tracked.length; tracked.push(t); caps.push(a); }
    });
    var radix = [], mul = 1, unit = {};
    tracked.forEach(function (t, i) { unit[t] = mul; radix.push(mul); mul *= caps[i] + 1; });
    function dec(u, i) { return Math.floor(u / radix[i]) % (caps[i] + 1); }
    function addU(u1, u2) {
      for (var i = 0; i < tracked.length; i++) if (dec(u1, i) + dec(u2, i) > caps[i]) return -1;
      return u1 + u2;
    }
    var binOps = OPS.filter(function (t) { return (availO[t] || 0) > 0; });
    var hasRoot = (availO.r || 0) > 0;
    var cfg = tracked.map(function (t, i) { return t + caps[i]; }).join(',') + '|' + binOps.join('') + '|' + (base.fractions ? 'F' : '');
    var tick = 0;

    function put(m, u, e) {
      var out = m.get(u); if (!out) { out = new Map(); m.set(u, out); }
      var k = e.v.n + '/' + e.v.d;
      if (!out.has(k)) out.set(k, e);
    }
    function dp(S) {
      var key = cfg + '#' + S, m = base.memo.get(key);
      if (m) return m;
      if (nowMs() > base.deadline) throw TIMEOUT;
      m = new Map();
      if (S.length === 1) put(m, 0, { v: { n: +S, d: 1 }, s: S, p: 4 });
      else {
        var sp = splits(S);
        for (var si = 0; si < sp.length; si++) {
          var A = sp[si][0], B = sp[si][1];
          var mA = dp(A), mB = dp(B);
          mA.forEach(function (vmA, uA) {
            mB.forEach(function (vmB, uB) {
              var uAB = addU(uA, uB);
              if (uAB < 0) return;
              for (var oi = 0; oi < binOps.length; oi++) {
                var o = binOps[oi], u = uAB;
                if (o === 'r') { /* binary root needs a √ cube: always tracked */ }
                if (idx[o] !== undefined) { u = addU(uAB, unit[o]); if (u < 0) continue; }
                if ((o === '+' || o === '*') && A > B) continue;
                var out = m.get(u); if (!out) { out = new Map(); m.set(u, out); }
                vmA.forEach(function (ea) {
                  vmB.forEach(function (eb) {
                    if (((++tick) & 4095) === 0 && nowMs() > base.deadline) throw TIMEOUT;
                    var r = opCore(o, ea.v, eb.v, base.fractions);
                    if (typeof r === 'string') return;
                    var k = r.n + '/' + r.d;
                    if (!out.has(k)) out.set(k, combine(o, ea, eb, r));
                  });
                });
              }
            });
          });
        }
      }
      if (hasRoot) {
        var adds = [];
        m.forEach(function (vm, u) {
          var u2 = addU(u, unit.r);
          if (u2 < 0) return;
          vm.forEach(function (e) {
            if (e.v.d !== 1 || e.v.n < 0) return;
            var r = opCore('r', TWO, e.v, false);
            if (typeof r !== 'string') adds.push([u2, { v: r, s: 'r' + wrap(e, 4), p: 4 }]);
          });
        });
        adds.forEach(function (a) { put(m, a[0], a[1]); });
      }
      base.memo.set(key, m);
      return m;
    }

    // Candidate digit multisets: all Required digits + some optional digits, smallest first.

function applySym(st, s, zone) {

  return o;
}

  if (!res.length) return null;
  var base = { goal: G.goal, fractions: G.fractions, maxDigits: o.maxDigits, timeMs: 90 };
  function possible(after) { return Eq.solve(Object.assign({ req: after.req, opt: after.perm, res: after.res, mode: 'impossible' }, base)).found; }
  if (res.length === 1) {

  cands.sort(function (a, b) { return b.w - a.w; });
  if (Math.random() > o.smart) return cands[0]; // a casual (not-so-careful) move
  var fallback = null, t0 = Date.now();
  for (var i = 0; i < cands.length && i < 8; i++) {
    var cd = cands[i], after = applySym(st, cd.s, cd.zone);
    if (!possible(after)) continue;
    if (!fallback) fallback = cd;
    var nowable = after.res.length >= 2 && (after.req.length + after.perm.length) > 0 &&
      Eq.solve(Object.assign({ req: after.req, opt: after.perm, res: after.res, mode: 'now' }, base, { maxDigits: Math.min(6, o.maxDigits + 1) })).found;
    if (!nowable) return cd;

}

  setTimeout(function () {

    cubes.forEach(function (c) { if (!Eq.isDigit(c.s) && st.ops.indexOf(c.s) < 0) { c.zone = 'forbidden'; c.locked = true; } });

function renderStats() {

  return false;
}
function tutAfterSolution(ok, tokens, chk) {
  if (ok) {
    S.tutorialDone = true; xpLog = []; addXP(30, 'Finished the tutorial!'); checkBadges({ type: 'tutorial' }); persist();
    Snd.chime(); victoryFX();
    modal('<h2>🎉 You did it!</h2><div class="row">' + pipHTML('cheer', 90, 'cheer') + '<div class="bubble">3 + 4 = 7. A correct <b>Now!</b> challenge scores <b>6</b> points!</div></div>' +
      '<p><b>Remember:</b></p><ul class="reasons" style="background:#e7f5ff"><li>On your turn: move ONE cube, or challenge.</li><li><b>⚡ Now!</b> = "I can make the Goal right now, with at most one more Resource cube."</li><li><b>🚫 Impossible!</b> = "Nobody can EVER make the Goal with these cubes."</li><li>When one cube is left, it goes to Required or Permitted, then everybody writes a Solution.</li><li>Correct = 6 (or 4 after the last cube). Not correct = 2. Everybody always scores something!</li></ul>' +
      '<div class="row"><button class="btn green big" data-act="closeModal">Let\'s play! ▶</button></div>', function () { G = null; TUT = null; drainQueue(function () { renderSetup(); go('setup'); }); });
  } else {
    Snd.boop();
    var why = chk && chk.reasons ? chk.reasons : ['No Solution yet.'];
    modal('<h2>🤔 Almost!</h2><ul class="reasons">' + why.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul><p style="text-align:center">Try building <b>3 + 4</b>: tap the 3, then the +, then the 4.</p><div class="row"><button class="btn green" data-act="closeModal">Try again</button></div>',
      function () { openSolutionBuilder(0, 'now', function () {}); });
  }
}

// ======================= INPUT: taps and drag-and-drop =======================
var drag = null, suppressClick = false;
document.addEventListener('click', function (e) {
  if (suppressClick) { suppressClick = false; e.preventDefault(); return; }
  var a = e.target.closest('[data-act]');
  if (!a) {
    var cube = e.target.closest('#game .z-res .cube, #game .zone .cube.locked');
    if (cube) ACT.cubeTap(cube);
    return;
  }
  var f = ACT[a.dataset.act];
  if (f) { Snd.init(); f(a, e); }
});
document.addEventListener('pointerdown', function (e) {
  var cube = e.target.closest('#game .z-res .cube');
  if (!cube || !G || !humanTurn()) return;
  drag = { id: +cube.dataset.id, x: e.clientX, y: e.clientY, on: false, el: cube };
});
document.addEventListener('pointermove', function (e) {
  if (!drag) return;
  if (!drag.on && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 10) {
    drag.on = true; var gh = $('#ghost'); gh.innerHTML = drag.el.outerHTML; gh.style.display = 'block';
    G.selected = drag.id; document.querySelectorAll('#game .zone[data-zone]').forEach(function (z) { if (['required', 'permitted', 'forbidden'].indexOf(z.dataset.zone) >= 0 && canMoveTo(z.dataset.zone)) z.classList.add('target'); });
    drag.el.style.opacity = '0.3';
  }
  if (drag.on) { var g = $('#ghost'); g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; e.preventDefault(); }
}, { passive: false });
document.addEventListener('pointerup', function (e) {
  if (!drag) return;
  var d = drag; drag = null;
  if (!d.on) return;
  suppressClick = true; setTimeout(function () { suppressClick = false; }, 50);
  $('#ghost').style.display = 'none';
  var t = document.elementFromPoint(e.clientX, e.clientY), z = t && t.closest('[data-zone]');
  if (z && ['required', 'permitted', 'forbidden'].indexOf(z.dataset.zone) >= 0) doMove(d.id, z.dataset.zone);
  else { G.selected = null; renderGame(); }
});
document.addEventListener('pointercancel', function () { if (drag && drag.on) { $('#ghost').style.display = 'none'; G.selected = null; renderGame(); } drag = null; });

// ----- 3D table hooks -----
T3.handlers = {
  canDrag: function (id) { return humanTurn() && G.cubes[id].zone === 'resources' && !G.cubes[id].locked; },
  dragStart: function (id) { G.selected = id; },
  cubeTap: function (id) {
    var c = G && G.cubes[id]; if (!c) return;
    if (c.zone === 'resources' || c.locked) { ACT.cubeTap({ dataset: { id: String(id) } }); return; }
    if (G.selected != null && humanTurn() && ['required', 'permitted', 'forbidden'].indexOf(c.zone) >= 0) doMove(G.selected, c.zone);
  },
  zoneTap: function (z) { if (G && G.selected != null && humanTurn()) doMove(G.selected, z); },
  drop: function (id, z) {
    if (G && z && ['required', 'permitted', 'forbidden'].indexOf(z) >= 0 && humanTurn()) { G.selected = id; doMove(id, z); }
    if (G && G.cubes[id].zone === 'resources') { G.selected = null; renderGame(); }
  },
  targetZones: function () { if (!G || G.selected == null || G.phase !== 'move') return []; return ['required', 'permitted', 'forbidden'].filter(canMoveTo); }
};

// ======================= START =======================
FX.init();
applyOppNames();
applyCosmetics();
$('#splashPip').innerHTML = pipSVG('happy');
window.TataGame = { S: function () { return S; }, G: function () { return G; }, render: function () { renderGame(); }, move: function (id, z) { if (G) { G.selected = id; doMove(id, z); } } }; // for testing in the browser console
})();
</script>
