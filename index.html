<!-- TITLE: the 3D title scene's layer (js/three/title.js); the whole splash is one big "tap to play" -->
<div id="t3title" aria-hidden="true"></div>
<section id="splash" class="screen on" data-act="start">
  <h1 class="logo">Tata's<span class="eq">Equations</span></h1>
  <div id="splashPip" class="pip" style="width:130px;height:146px"></div>
  <button class="btn big yellow tapgo" data-act="start"><svg class="ico f" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg> Tap to Play!</button>
</section>
